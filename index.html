<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labesny — the rebuilt storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens are lib/core/design.dart, value for value. */
  :root{
    --ink:#0C0D10; --ink80:#2A2C31; --ink60:#55585F; --ink40:#8A8D94; --ink20:#C2C4C9;
    --paper:#FAF8F5; --paper-deep:#F1EDE7; --card:#fff; --line:#E6E2DB; --line-soft:#EFECE6;
    --clay:#C2654F; --clay-deep:#9E4E3C; --clay-soft:#F6E4DE;
    --good:#1E6F52; --good-soft:#E2F0EA; --sale:#C62F2F; --sale-soft:#FBE9E9; --gold:#B08A3E;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px; --gutter:18px;
    --ease:cubic-bezier(.22,1,.36,1);
    --display:"Familjen Grotesk",system-ui,sans-serif;
    --body:"Figtree",system-ui,sans-serif;
    --arabic:"Noto Kufi Arabic","Figtree",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#151518;font-family:var(--body);color:var(--ink)}

  /* ---------- the workbench around the phone ---------- */
  .wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{background:#1c1c20;border-right:1px solid #2a2a30;padding:24px 0 40px;overflow-y:auto;
    max-height:100vh;position:sticky;top:0}
  .side h1{font-family:var(--display);font-size:19px;color:#fff;letter-spacing:-.5px;padding:0 20px;line-height:1.15}
  .side .sub{font-size:11.5px;color:#83838d;padding:8px 20px 0;line-height:1.5}
  .side .warn{margin:14px 20px 0;font-size:11px;color:#c9a08e;border-left:2px solid var(--clay);
    padding-left:9px;line-height:1.5}
  .side .grp{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#5e5e68;
    padding:22px 20px 7px}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    font-family:var(--body);font-size:13px;color:#b6b6bf;padding:8px 20px;border-left:2px solid transparent;
    transition:all .12s var(--ease)}
  .side button:hover{color:#fff;background:#232329}
  .side button[aria-current="true"]{color:#fff;background:#26262d;border-left-color:var(--clay);font-weight:600}

  .main{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 20px 40px;gap:14px}
  .screen-name{font-family:var(--display);font-size:20px;color:#fff;letter-spacing:-.5px}
  .screen-note{color:#8b8b93;font-size:12.5px;max-width:420px;text-align:center;line-height:1.55}
  .phone{width:390px;height:844px;background:var(--paper);border-radius:34px;overflow:hidden;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 9px #0d0d10,0 0 0 10px #303036;flex:none}
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column}
  .view::-webkit-scrollbar{display:none}
  .view>*{flex:none}
  .pad{padding:0 var(--gutter)}
  [dir="rtl"]{font-family:var(--arabic)}
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr}
    /* Pinned, so you can change screen without scrolling back up. */
    .side{position:sticky;top:0;z-index:30;max-height:none;overflow:visible;
      border-right:0;border-bottom:1px solid #2a2a30;padding:12px 0 0}
    .side h1{font-size:14px;letter-spacing:0}
    /* The blurb and the note are for someone deciding whether to look. On a phone they are
       between you and the thing itself, so they go. */
    .side .sub,.side .warn,.side .grp{display:none}
    /* One scrolling row instead of a column twelve hundred pixels tall. */
    .wrap,.side,.main{min-width:0}
    .side nav{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;
      width:100%;max-width:100vw;min-width:0;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .side nav::-webkit-scrollbar{display:none}
    .side button{width:auto;flex:0 0 auto;white-space:nowrap;padding:7px 13px;font-size:12.5px;
      border:1px solid #34343d;border-radius:999px;border-left-width:1px}
    .side button[aria-current="true"]{background:var(--clay);color:#fff;
      border-color:var(--clay);font-weight:600}
    .main{padding:14px 12px 32px;gap:10px}
    .screen-name{font-size:15px}
    .screen-note{font-size:12px}
    .phone{max-width:100%;height:min(844px,calc(100dvh - 164px))}
  }

  /* ---------- type ---------- */
  .display{font-family:var(--display);font-weight:700;letter-spacing:-.032em;line-height:.98}
  [dir="rtl"] .display{font-family:var(--arabic);letter-spacing:0;line-height:1.35}
  .lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink40);line-height:1.2}
  [dir="rtl"] .lbl{letter-spacing:0}
  .price{font-family:var(--body);font-weight:700;letter-spacing:-.01em}

  /* ---------- chrome ---------- */
  .bar{display:flex;align-items:center;gap:6px;padding:10px var(--gutter);background:var(--paper);position:sticky;top:0;z-index:20}
  .wordmark{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.7px;flex:1}
  .bar h3{font-family:var(--display);font-size:21px;letter-spacing:-.67px;flex:1}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;cursor:pointer;color:var(--ink)}
  .lang{border:1.2px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:12px;font-weight:700;background:none;color:var(--ink)}
  .bag-dot{position:relative}
  .bag-dot em{position:absolute;top:-1px;inset-inline-end:-1px;background:var(--clay);color:#fff;font-size:9px;
    font-weight:700;font-style:normal;min-width:16px;height:16px;border-radius:var(--r-pill);display:grid;place-items:center}
  .page-bar{display:flex;align-items:center;gap:10px;padding:12px var(--gutter);position:sticky;top:0;background:var(--paper);z-index:20}
  .page-bar h3{font-family:var(--display);font-size:19px;letter-spacing:-.6px}

  .ticker{background:var(--ink);height:38px;display:flex;align-items:center;overflow:hidden}
  .ticker .run{display:flex;gap:16px;align-items:center;white-space:nowrap;animation:run 26s linear infinite;padding-inline-end:16px}
  .ticker b{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--paper)}
  [dir="rtl"] .ticker b{letter-spacing:0}
  .ticker i{width:4px;height:4px;border-radius:50%;background:var(--clay);display:block}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker .run{animation:none}}

  /* ---------- hero ---------- */
  .hero{position:relative;height:470px;overflow:hidden}
  .hero>img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.13) 45%,rgba(7,8,10,.8))}
  .hero .copy{position:absolute;inset-inline:var(--gutter);bottom:26px;color:#fff}
  .hero .copy .lbl{color:var(--clay-soft)}
  .hero h2{font-size:46px;margin:12px 0 14px;color:#fff;white-space:pre-line}
  .hero p{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.84)}
  .hero .cta{display:flex;gap:10px;margin-top:20px}
  .dots{display:flex;gap:6px;margin-top:18px}
  .dots i{height:3px;width:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.4);display:block}
  .dots i.on{width:22px;background:rgba(255,255,255,.95)}

  /* ---------- buttons ---------- */
  .btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:var(--r-pill);padding:17px 24px;border:0;
    cursor:pointer;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .14s var(--ease)}
  .btn:active{transform:scale(.97)}
  .btn.ink{background:var(--ink);color:var(--paper)} .btn.paper{background:var(--card);color:var(--ink)}
  .btn.clay{background:var(--clay);color:#fff} .btn.outline{background:transparent;color:var(--ink);border:1.2px solid var(--ink20)}
  .btn.ghost{background:none;color:var(--ink60)}
  .btn.sm{padding:11px 16px;font-size:12.5px} .btn.block{width:100%}
  .btn[disabled]{opacity:.35}

  /* ---------- heads, rails, cards ---------- */
  .head{padding:0 var(--gutter) 14px;display:flex;align-items:flex-end;gap:12px}
  .head h3{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.83px;line-height:.98}
  [dir="rtl"] .head h3{font-family:var(--arabic);letter-spacing:0;line-height:1.35}
  .head .link{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--clay);white-space:nowrap}
  .rail{display:flex;gap:10px;overflow-x:auto;padding:0 var(--gutter) 28px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail .card{flex:0 0 158px;width:158px}
  .card .shot{position:relative;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;background:var(--paper-deep)}
  .card .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .card .brand{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink60);
    margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .name{font-size:13px;line-height:1.3;margin-top:5px;color:var(--ink);display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .money{margin-top:7px;display:flex;align-items:baseline;gap:7px}
  .card .money b{font-size:14px} .card .money s{font-size:11.2px;color:var(--ink40);font-weight:400}
  .card .money.off b{color:var(--sale)}
  .pill{position:absolute;top:8px;inset-inline-start:8px;background:var(--ink);color:var(--paper);font-size:9.5px;
    font-weight:700;letter-spacing:1.6px;padding:4px 8px;border-radius:var(--r-sm);text-transform:uppercase}
  .pill.sale{background:var(--sale);letter-spacing:.4px}
  .pill.flat{position:static}
  .heart{position:absolute;top:6px;inset-inline-end:6px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink)}
  .heart.on{color:var(--clay)}
  .quick{position:absolute;bottom:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:var(--paper);
    display:grid;place-items:center;box-shadow:0 6px 17px rgba(36,26,18,.14)}
  .sold{position:absolute;inset:0;background:rgba(250,248,245,.62);display:grid;place-items:center}
  .why{margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:var(--clay-soft);color:var(--clay-deep);
    font-size:10.5px;font-weight:600;padding:4px 7px;border-radius:var(--r-sm);max-width:100%;line-height:1.2}
  .why span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:0 var(--gutter) 40px}

  /* ---------- departments, sale block, brands ---------- */
  .rooms{display:flex;gap:10px;overflow-x:auto;padding:0 var(--gutter) 34px;scrollbar-width:none}
  .rooms::-webkit-scrollbar{display:none}
  .rooms a{flex:0 0 136px;height:190px;border-radius:var(--r-md);overflow:hidden;position:relative;display:block}
  .rooms img{width:100%;height:100%;object-fit:cover}
  .rooms .g{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(7,8,10,.7))}
  .rooms b{position:absolute;inset-inline-start:12px;bottom:12px;color:#fff;font-family:var(--display);font-size:19px;
    letter-spacing:-.6px;text-transform:uppercase}
  [dir="rtl"] .rooms b{font-family:var(--arabic);letter-spacing:0;text-transform:none;font-size:17px}
  .sale-block{margin:6px var(--gutter) 34px;background:var(--ink);border-radius:var(--r-lg);padding:24px;color:var(--paper)}
  .sale-block .lbl{color:var(--clay)}
  .sale-block h3{font-family:var(--display);font-size:30px;letter-spacing:-.96px;line-height:1;margin:12px 0 10px}
  [dir="rtl"] .sale-block h3{font-family:var(--arabic);letter-spacing:0;line-height:1.3;font-size:26px}
  .sale-block p{font-size:13.5px;color:var(--ink20);line-height:1.45;margin-bottom:20px}
  .brands{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--gutter) 36px}
  .brands span{border:1.2px solid var(--line);border-radius:var(--r-pill);padding:10px 14px;font-size:12.5px;font-weight:600}

  footer{background:var(--ink);color:var(--paper);padding:40px var(--gutter)}
  footer .mark{font-family:var(--display);font-size:32px;letter-spacing:-1px}
  footer .tag{font-size:13px;color:var(--ink40);margin:10px 0 26px}
  footer .lbl{color:var(--clay);margin-bottom:6px;display:block}
  footer a{display:block;padding:9px 0;font-size:13px;color:var(--ink20);text-decoration:none}
  footer .fine{font-size:12px;color:var(--ink40);margin-top:22px}

  /* ---------- collection ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gutter) 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips span{white-space:nowrap;border:1.2px solid var(--line);border-radius:var(--r-pill);padding:11px 16px;font-size:12.5px;font-weight:600}
  .chips span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .filterbar{position:sticky;top:54px;z-index:15;background:var(--paper);display:flex;align-items:center;gap:14px;padding:8px var(--gutter) 10px}
  .filterbar h3{font-family:var(--display);font-size:22px;letter-spacing:-.7px}
  [dir="rtl"] .filterbar h3{font-family:var(--arabic);letter-spacing:0}
  .filterbar small{display:block;font-size:11.5px;color:var(--ink40);margin-top:3px}
  .refine{margin-inline-start:auto;border:1.2px solid var(--line);border-radius:var(--r-pill);padding:9px 14px;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;background:none;font-family:inherit}
  .refine.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- product ---------- */
  .gallery{position:relative;aspect-ratio:3/4;background:var(--paper-deep);overflow:hidden}
  .gallery .strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .gallery .strip::-webkit-scrollbar{display:none}
  .gallery img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;object-position:top center;scroll-snap-align:start}
  .gallery .count{position:absolute;bottom:14px;inset-inline-end:14px;background:rgba(12,13,16,.58);color:#fff;
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--r-pill)}
  .back{position:absolute;top:10px;inset-inline-start:10px;width:38px;height:38px;border-radius:50%;
    background:rgba(250,248,245,.92);display:grid;place-items:center;box-shadow:0 5px 14px rgba(36,26,18,.13)}
  .pdp-head{padding:20px var(--gutter) 0}
  .pdp-head .brand{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--clay)}
  .pdp-head h2{font-family:var(--display);font-size:26px;letter-spacing:-.83px;line-height:1.02;margin:9px 0 14px}
  .sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sizes b{min-width:50px;text-align:center;padding:12px 14px;border:1.2px solid var(--line);border-radius:var(--r-sm);
    font-size:13.5px;font-weight:600}
  .sizes b.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sizes b.out{color:var(--ink20);text-decoration:line-through}
  .low{display:flex;align-items:center;gap:6px;margin-top:14px;color:var(--sale);font-size:12.5px;font-weight:600}
  .bundle{margin:0 var(--gutter) 26px;background:var(--paper-deep);border-radius:var(--r-lg);padding:16px}
  .bundle h4{font-family:var(--display);font-size:19px;letter-spacing:-.6px;display:flex;align-items:center;gap:7px}
  .brow{display:flex;gap:12px;align-items:flex-start;margin-top:16px}
  .brow .t{width:56px;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:#fff;flex:none}
  .brow .t img{width:100%;height:100%;object-fit:cover}
  .brow .meta{flex:1;min-width:0}
  .brow .k{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink40)}
  .brow .n{font-size:13px;font-weight:600;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .mini{display:flex;gap:6px;margin-top:9px}
  .brow .mini b{padding:7px 11px;border:1.2px solid var(--line);border-radius:var(--r-sm);font-size:12px;font-weight:600;background:var(--paper)}
  .brow .mini b.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .plus{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--ink40)}
  .plus hr{flex:1;border:0;border-top:1px solid var(--line)}
  .bundle .total{display:flex;align-items:center;gap:8px;margin-top:16px}
  .bundle .total span{font-size:13px;color:var(--ink60)} .bundle .total b{font-size:18px}
  .fold{border-bottom:1px solid var(--line-soft);padding:16px 0}
  .fold .t{display:flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
  .fold .t svg{margin-inline-start:auto;color:var(--ink60)}
  .fold p,.fold li{font-size:13.5px;color:var(--ink60);line-height:1.55;margin-top:10px;list-style:none}
  .buybar{background:var(--paper);border-top:1px solid var(--line-soft);padding:12px var(--gutter);
    display:flex;align-items:center;gap:14px;box-shadow:0 -8px 24px rgba(36,26,18,.05);z-index:20;margin-top:auto}

  /* ---------- sheets and overlays ---------- */
  .over{position:absolute;inset:0;background:rgba(12,13,16,.42);display:flex;align-items:flex-end;z-index:40}
  .sheet{background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;padding-bottom:18px;max-height:92%;
    display:flex;flex-direction:column;overflow:hidden}
  .grip{width:38px;height:4px;background:var(--line);border-radius:var(--r-pill);margin:10px auto 0;flex:none}
  .sheet .body{overflow-y:auto;scrollbar-width:none}
  .sheet .body::-webkit-scrollbar{display:none}
  .sheet h3{font-family:var(--display);font-size:24px;letter-spacing:-.77px}
  .accent{width:40px;height:4px;border-radius:var(--r-pill);margin:20px 0 16px}
  .drawer-head{display:flex;align-items:center;padding:16px var(--gutter) 12px;flex:none}
  .drawer-head h3{flex:1}
  .meter{margin:4px var(--gutter) 14px;padding:14px;border-radius:var(--r-md);background:var(--paper-deep)}
  .meter .r{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .meter .track{height:5px;border-radius:var(--r-pill);background:var(--line);margin-top:11px;overflow:hidden}
  .meter .track i{display:block;height:100%;background:var(--clay);border-radius:var(--r-pill)}
  .meter.done{background:var(--good-soft)} .meter.done .r{color:var(--good)} .meter.done .track i{background:var(--good)}
  .line{display:flex;gap:13px;padding:10px var(--gutter)}
  .line .t{width:70px;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--paper-deep);flex:none}
  .line .t img{width:100%;height:100%;object-fit:cover}
  .line .m{flex:1;min-width:0}
  .line .n{font-size:13.5px;font-weight:600;line-height:1.3}
  .line .s{font-size:12px;color:var(--ink40);margin-top:4px}
  .stepper{display:inline-flex;align-items:center;border:1.2px solid var(--line);border-radius:var(--r-pill);margin-top:9px}
  .stepper button{border:0;background:none;padding:6px 10px;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .stepper b{font-size:13px;min-width:18px;text-align:center}
  .foot{border-top:1px solid var(--line-soft);padding:14px var(--gutter);background:var(--paper);flex:none}
  .foot .sum{display:flex;align-items:center;margin-bottom:12px}
  .foot .sum span{font-size:13.5px;color:var(--ink60)} .foot .sum b{margin-inline-start:auto;font-size:17px}

  .toast{position:absolute;inset-inline:14px;bottom:76px;background:var(--ink);color:var(--paper);border-radius:var(--r-md);
    padding:14px 16px;display:flex;align-items:center;gap:14px;z-index:40;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .toast .tx{flex:1} .toast b{font-size:13.5px;font-weight:700} .toast p{font-size:12.5px;color:var(--ink20);margin-top:3px}
  .toast a{color:var(--clay-soft);font-size:12.5px;font-weight:700;white-space:nowrap}

  /* ---------- summary rows, account, club ---------- */

  .row span{font-size:13.5px;color:var(--ink60)} .row b{margin-inline-start:auto;font-size:14px}
  .row.big span{font-size:15px;font-weight:700;color:var(--ink)} .row.big b{font-size:18px}
  .row.free b{color:var(--good);font-size:13px;letter-spacing:1.6px;text-transform:uppercase}
  hr.rule{border:0;border-top:1px solid var(--line);margin:10px 0}
  .rowlink{display:flex;align-items:center;gap:14px;padding:15px var(--gutter);border-top:1px solid var(--line-soft)}
  .rowlink .tx{flex:1} .rowlink .tx b{font-size:14.5px;font-weight:600;display:block}
  .rowlink .tx small{font-size:12.5px;color:var(--ink40)}
  .field{margin:0 var(--gutter) 12px}
  .field label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink40);display:block;margin-bottom:6px}
  .field .inp{border:1.2px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;font-size:14px;background:var(--card)}
  .field .inp.ph{color:var(--ink20)}

  .sortopt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink20)}

  /* ---------- docs ---------- */
  .doc{padding:4px var(--gutter) 60px}
  .doc .lead{font-size:16px;color:var(--ink);line-height:1.55}
  .doc h4{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--clay);margin:22px 0 10px}
  [dir="rtl"] .doc h4{letter-spacing:0}

  .doc li span{font-size:14px;color:var(--ink60);line-height:1.55}

  .qa .q{display:flex;align-items:flex-start;gap:10px;font-size:15px;font-weight:600}
  .qa .q svg{margin-inline-start:auto;color:var(--ink60);flex:none}
  .qa .a{font-size:14px;color:var(--ink60);line-height:1.6;margin-top:10px}

  .empty{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 36px;text-align:center}
  .empty p{font-size:15px;color:var(--ink60)}

  /* ---------- the bar along the bottom ---------- */
  /* Docked to the phone rather than sitting in the page's scroll, because that is where the
     Scaffold puts it. Paper and a hairline; the marks are the Women'secret sprite. */
  .docked{position:absolute;inset-inline:0;bottom:0;z-index:30;display:flex;flex-direction:column}
  .phone>.over{position:absolute;inset:0;z-index:40}
  .navbar{background:var(--paper);border-top:1px solid var(--line-soft);display:flex;height:60px}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;color:var(--ink40);transition:color .26s var(--ease)}

  .nav-item b{font-size:10px;font-weight:500;line-height:1.1}
  .nav-item.on b{font-weight:700}

  .nav-item i{height:2.5px;width:0;background:var(--clay);border-radius:var(--r-pill);
    transition:width .26s var(--ease)}
  .nav-item.on i{width:14px}
